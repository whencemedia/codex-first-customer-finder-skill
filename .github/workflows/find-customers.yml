name: Find customers

on:
  schedule:
    - cron: "17 3 * * 1" # Mondays 08:47 IST: new prospects for Whence
  workflow_dispatch:
    inputs:
      product:
        description: "Product or brand URL (or a short description) to find customers for"
        required: true
        default: "https://whencemedia.com"
      count:
        description: "How many prospects"
        required: false
        default: "15"
      focus:
        description: "Optional extra direction (who to target or avoid)"
        required: false
        default: ""
      add_to_sheet:
        description: "Add prospects with a public email to the India tab of the lead sheet"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: find-customers
  cancel-in-progress: false

jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PRODUCT: ${{ github.event.inputs.product || 'https://whencemedia.com' }}
      COUNT: ${{ github.event.inputs.count || '15' }}
      FOCUS: ${{ github.event.inputs.focus || 'Indian D2C brands, founder-led businesses, and coaches who already have clients but a small online presence. They should have real revenue and already value brand building. No celebrity brands, no huge companies, no tiny side projects. Avoid brands that only want performance or influencer marketing.' }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      LEADS_SHEET_ID: ${{ secrets.LEADS_SHEET_ID || '1Qg2mwQbDsUkqVunOa0nVlU6t6aKByFmMtKgWV-kVKw4' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run First Customer Finder with Claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Use the first-customer-finder skill in .claude/skills/first-customer-finder.
            Product: ${{ env.PRODUCT }}
            Find ${{ env.COUNT }} potential customers.
            Extra direction: ${{ env.FOCUS }}
            Keep working files and history under out/history/.
            Save the full report as Markdown and CSV in out/ with today's date in the file names.

            Also write out/sheet-rows.csv with exactly this header row:
            Date added,Segment,Name,Niche,City,Website,Instagram,Founder Instagram,Founder LinkedIn,Size / budget signal,Brand-minded signal,Public email,Public phone,Why they're a fit,Source,Status,Notes
            One row per qualified prospect. Date added is today (YYYY-MM-DD). Segment is one of: D2C brand, Startup / funded, Local business, Coach / creator. Public email must be a business email published on the prospect's own website or official profile; leave it empty if you cannot find one, never guess. Source is the URL of the public evidence. Status is New. Use plain sentences, no em dashes.

            Do not contact anyone. Do not ask questions; make reasonable assumptions and note them in the report.
          claude_args: |
            --allowedTools WebSearch,WebFetch,Read,Write,Edit,Glob,Grep,Bash(python3:*),Bash(python:*),Bash(mkdir:*),Bash(ls:*),Bash(date:*)
            --max-turns 80

      - name: Add prospects to the lead sheet
        if: github.event_name == 'schedule' || github.event.inputs.add_to_sheet == 'true'
        run: |
          pip install --quiet gspread
          python whence/push_to_sheet.py out/sheet-rows.csv India | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Keep the report for 30 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: customer-finder-${{ github.run_id }}
          path: out/
          retention-days: 30
